<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự Án HHH - Khởi Tạo Thành Công</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      color: #f8fafc;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Background glow circles */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      width: 400px;
      height: 400px;
      background: #6366f1;
      top: 10%;
      left: 15%;
    }
    .glow-2 {
      width: 350px;
      height: 350px;
      background: #ec4899;
      bottom: 10%;
      right: 15%;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 44px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .icon-wrapper {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.35);
    }

    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .card-info {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px;
      text-align: left;
      margin-bottom: 28px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
    }
    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .info-row:first-child {
      padding-top: 0;
    }

    .info-label {
      color: #64748b;
      font-weight: 500;
    }

    .info-value {
      color: #e2e8f0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-branch {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .footer-note {
      font-size: 13px;
      color: #64748b;
    }
    .footer-note span {
      color: #a855f7;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      HỆ THỐNG ĐÃ KẾT NỐI
    </div>

    <div class="icon-wrapper">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1>Khởi Tạo Thành Công!</h1>
    <p class="subtitle">Dự án mới <strong>HHH</strong> đã được thiết lập và sẵn sàng để xây dựng các tính năng tiếp theo.</p>

    <div class="card-info">
      <div class="info-row">
        <span class="info-label">Dự án</span>
        <span class="info-value">HHH</span>
      </div>
      <div class="info-row">
        <span class="info-label">Repository</span>
        <span class="info-value">hhhuong1st/hhh</span>
      </div>
      <div class="info-row">
        <span class="info-label">Nhánh chính</span>
        <span class="info-value"><span class="badge-branch">main</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">Trạng thái</span>
        <span class="info-value" style="color: #34d399;">● Hoạt động bình thường</span>
      </div>
    </div>

    <p class="footer-note">Sẵn sàng để triển khai phiên bản chính thức 🚀</p>
  </div>
</body>
</html>
